# Local pre-push gate — the cheap, high-signal subset of CI, run before code
# leaves the machine. Every command here mirrors a step in
# .github/workflows/ci.yml so the local loop and CI never diverge; CI remains
# the authoritative full-suite gate (this hook is the fast first signal, not a
# replacement). Commands run in parallel, so wall-clock ≈ the slowest one and
# all failures surface together.
#
# Escape hatch for genuine WIP: `git push --no-verify` (CI still enforces).
pre-push:
  parallel: true
  commands:
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    tenant-scope:
      run: pnpm ci:tenant-scope
    rls-audit:
      run: pnpm ci:rls-audit
    analytics-events:
      run: pnpm ci:analytics-events
    static-policy:
      run: pnpm ci:static-policy
    response-status:
      run: pnpm ci:response-status
    admin-aal2:
      run: pnpm ci:admin-aal2
    config-coverage:
      run: pnpm ci:config-coverage
    process-env:
      run: pnpm ci:process-env
    # Affected tests only (module graph vs origin/main) to keep the hook fast.
    # CI runs the full `pnpm test` suite as the backstop for anything the
    # change graph misses (e.g. config/env-only changes run zero tests here).
    test-changed:
      run: pnpm test:changed
    # Import-graph blind spot: `vitest --changed` (test-changed above) only runs
    # tests reachable from changed files' MODULE graph. The src/__tests__/* guard
    # tests read files via readFileSync / the ESLint Node API instead of importing
    # the code they check, so they are in NO import graph and `--changed` silently
    # skips them — a config/source change can break a guard with a false-green
    # push. Run them unconditionally; they are fast file reads. CI's full
    # `pnpm test` still backstops everything else.
    guards:
      run: pnpm vitest run src/__tests__
    reviews-status:
      run: pnpm ci:reviews-status
    outbox-topics:
      run: pnpm ci:outbox-topics
    db-imports:
      run: pnpm ci:db-imports
