name: Setup Node + pnpm
description: Install Node (from .nvmrc) and pnpm, with a cached pnpm store and frozen-lockfile install.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Prepare pnpm
      shell: bash
      run: corepack prepare pnpm@11.0.9 --activate

    - name: Get pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
        # Keyed on the CPU architecture too: the self-hosted runner is arm64,
        # hosted is x64, and the store holds platform-specific native packages.
        key: ${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-pnpm-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
