name: Prepare test database
description: >
  Provisions the job's Postgres service container to migrations head by
  delegating to scripts/test-db-setup.sh — the single owner of the schema
  recipe (bootstrap order, one-session RESET ALL hygiene, the live-DB
  advisory lock, and the test_meta.provision marker that ci:rls-audit's live
  check validates). Shared by the `test` and `e2e` jobs; a second copy of the
  psql loop here is exactly the drift #877 closed.

inputs:
  host:
    description: Postgres host
    default: localhost
  port:
    description: Postgres port
    default: "5432"
  user:
    description: Postgres user
    default: test
  password:
    description: Postgres password
    default: test
  database:
    description: Postgres database
    default: test

runs:
  using: composite
  steps:
    - name: Provision via scripts/test-db-setup.sh
      shell: bash
      env:
        TEST_DATABASE_POOL_URL: postgres://${{ inputs.user }}:${{ inputs.password }}@${{ inputs.host }}:${{ inputs.port }}/${{ inputs.database }}
      run: bash scripts/test-db-setup.sh
