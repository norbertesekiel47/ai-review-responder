name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Docs/markdown-only PRs touch no React code — skip them.
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # `scope: changed` diffs against the base branch to report only
          # PR-introduced issues; a shallow clone can't reach it.
          fetch-depth: 0
      - uses: millionco/react-doctor@1a30f2caac12f1678243cb8733dd7bc1b598a9da # pinned from main 2026-07-16
        with:
          blocking: error
