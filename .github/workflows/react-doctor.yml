name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Docs/markdown-only PRs touch no React code — skip them.
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    # Same runner switch as ci.yml: `vars.CI_RUNNER` (self-hosted) or hosted fallback.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `scope: changed` diffs against the base branch to report only
          # PR-introduced issues; a shallow clone can't reach it.
          fetch-depth: 0
      # Pinned to the v2.2.8 RELEASE commit, not to `main`. This action runs with
      # pull-requests/issues/statuses write, so it tracks tagged releases only —
      # a `main` pin means every Dependabot bump is an unreviewed branch jump
      # (the one this replaced was 235 commits). Bump this to the next v* tag's
      # commit SHA, never to a branch head.
      - uses: millionco/react-doctor@01820bb4fd4d0a4aebcd8df2b2a143a098649cb2 # v2.2.8
        with:
          blocking: error
          # The action's `version` input defaults to `latest`. Left unset, this
          # blocking gate re-resolves the analyzer on every run, so findings can
          # change day to day with no change in this repo. Pin it, and keep it in
          # LOCKSTEP with the `doctor` script in package.json — both execute
          # react-doctor and must run the same analyzer. Bump them together.
          version: '0.9.11'
