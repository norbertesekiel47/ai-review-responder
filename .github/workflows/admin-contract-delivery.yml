name: Admin contract delivery

on:
  push:
    branches: [main]
    paths: ['docs/admin-api/**']
  workflow_dispatch:

permissions:
  contents: read

# Dispatch also recovers a failed delivery or bootstraps the existing snapshot.
# Always read current main so an older queued run cannot roll the contract back.
concurrency:
  group: admin-contract-delivery
  cancel-in-progress: false

jobs:
  deliver:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout source with read-only workflow token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ github.token }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Open or update the Admin app contract PR
        env:
          ADMIN_CONTRACT_DELIVERY_TOKEN: ${{ secrets.ADMIN_CONTRACT_DELIVERY_TOKEN }}
        run: node scripts/admin-contract-delivery.ts
