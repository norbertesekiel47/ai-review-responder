name: Fallow

# Advisory codebase-health gate. Runs `fallow audit --gate new-only`, which
# respects the rule severities in .fallowrc.jsonc and fails ONLY on findings
# this PR introduces (the large acknowledged backlog in .fallowrc.jsonc is not
# re-litigated). The check can go red but is NOT a required status check yet —
# promote it in branch protection once the signal is trusted.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Docs/markdown-only PRs change no code health signal — skip them.
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: fallow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fallow:
    name: fallow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history (all branches) so the PR's base branch — origin/<base> —
          # is available to fallow as the diff base.
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup
      - name: Install fallow
        run: npm install -g fallow@2.88.2
      - name: Fallow audit (new findings only)
        env:
          # Stacked PRs target a non-main base. Compare against the PR's actual
          # base branch so we never re-count the parent branch's findings as new.
          # Normal PRs (base = main) resolve to origin/main, the prior behaviour.
          FALLOW_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: pnpm ci:fallow
