name: Fallow

# Advisory codebase-health gate. Runs `fallow audit --gate new-only`, which
# respects the rule severities in .fallowrc.jsonc and fails ONLY on findings
# this PR introduces (the large acknowledged backlog in .fallowrc.jsonc is not
# re-litigated). The check can go red but is NOT a required status check yet —
# promote it in branch protection once the signal is trusted.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Docs/markdown-only PRs change no code health signal — skip them.
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: fallow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fallow:
    name: fallow
    runs-on: ubuntu-latest
    # Bumped from 10 → 15: the job runs a full `vitest run --coverage` before the
    # audit (the static-only scan was sub-second). Coverage gen ~2-3 min on CI
    # + fallow ~40s leaves comfortable headroom; 15 absorbs runner variance.
    # The DB now makes the integration suites actually execute here (#581), which
    # adds ~1 min — still inside 15.
    timeout-minutes: 15
    # A real Postgres so the ~37 *.integration.test.ts suites RUN instead of
    # self-skipping. Without it every module whose only coverage is an integration
    # suite reads 0% covered, and CRAP (complexity × uncovered²) is inflated by up
    # to its full complexity — phantom debt tickets repo-wide (#581).
    #
    # This is a per-JOB service container on this job's own runner, reached at
    # localhost:5432 — NOT a database shared with ci.yml. `ci.yml`'s test job and
    # `e2e.yml` already each stand up their own identical container and run
    # concurrently on the same PR; this is the third instance of that same
    # pattern, so there is no cross-workflow contention to create.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The gate the DB-backed suites check before running.
      TEST_DATABASE_POOL_URL: postgres://test:test@localhost:5432/test
      # The `src/lib/db/server` singleton default. Suites that initialize it
      # without an explicit override must land on the same database, or whichever
      # file initializes it first wins and the rest get ECONNREFUSED (#563).
      DATABASE_POOL_URL: postgres://test:test@localhost:5432/test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history (all branches) so the PR's base branch — origin/<base> —
          # is available to fallow as the diff base.
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup
      - name: Install fallow
        # Pinned (same philosophy as the react-doctor pin in package.json): a
        # floating version makes findings drift day to day. v3.0 is flag/config/
        # JSON-contract compatible with v2 per its release notes; verified
        # empirically before this bump — same diff, same verdict, new-rule
        # findings classified inherited and excluded by --gate new-only.
        run: npm install -g fallow@3.16.0
      - name: Prepare test database
        # Same composite action as ci.yml's `test` job and e2e.yml — one owner for
        # the schema recipe (bootstrap + every migration, in order).
        uses: ./.github/actions/test-db
      - name: Generate coverage
        # Produces coverage/coverage-final.json (v8 json reporter) for the audit's
        # runtime layer, WITH the integration suites executing against the service
        # container above — so integration-covered lines are visible to CRAP.
        #
        # Still a SECOND suite run dedicated to fallow (it double-runs the suite
        # per PR). Sharing ci.yml's run instead would need a cross-workflow
        # artifact: `needs:` cannot span workflows, and moving this job into
        # ci.yml would force `ci:fallow:coverage` into lefthook's pre-push too
        # (src/__tests__/ci-audit-wiring.test.ts requires every ci:* in ci.yml to
        # mirror there), putting a full coverage run in every push. The duplicate
        # run is the cheaper trade.
        run: pnpm test:coverage
      - name: Fallow audit (new findings only, coverage-informed)
        env:
          # Stacked PRs target a non-main base. Compare against the PR's actual
          # base branch so we never re-count the parent branch's findings as new.
          # Normal PRs (base = main) resolve to origin/main, the prior behaviour.
          FALLOW_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: pnpm ci:fallow:coverage
