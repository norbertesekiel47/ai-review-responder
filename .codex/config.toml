developer_instructions = "Use Simplified Technical English: short direct sentences, familiar words, explain necessary technical terms, keep all material evidence."

sandbox_mode = "workspace-write"
web_search = "live"
model_verbosity = "high"
model_reasoning_summary = "detailed"

[features]
hooks = true

# Optional direct integrations: registration is not authentication. OAuth is
# per developer; credentials never belong in this checked-in configuration.
[mcp_servers.stripe]
url = "https://mcp.stripe.com"
required = false
startup_timeout_sec = 15
tool_timeout_sec = 60

[mcp_servers.sentry]
url = "https://mcp.sentry.dev/mcp/repworth-nv/javascript-nextjs"
required = false
startup_timeout_sec = 15
tool_timeout_sec = 60

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
required = false
startup_timeout_sec = 15
tool_timeout_sec = 60

[sandbox_workspace_write]
network_access = true

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_SUBAGENT_MODEL = "sonnet"

[mcp_servers.higgsfield]
url = "https://mcp.higgsfield.ai/mcp"

[mcp_servers.runway]
url = "https://mcp.runwayml.com/mcp"

[mcp_servers.openart]
url = "https://mcp.openart.ai/mcp"

[mcp_servers."21st"]
url = "https://21st.dev/api/mcp"
enabled = false
env_http_headers = { "x-api-key" = "TWENTYFIRST_API_KEY" }

[mcp_servers.atlascloud]
command = "npx"
args = ["--no-install", "atlascloud-mcp"]
env_vars = ["ATLASCLOUD_API_KEY"]
enabled = false
