sandbox_mode = "workspace-write"
web_search = "live"
model_verbosity = "high"
model_reasoning_summary = "detailed"

[features]
hooks = true

# Optional direct integrations: registration is not authentication. OAuth is
# per developer; credentials never belong in this checked-in configuration.
[mcp_servers.stripe]
url = "https://mcp.stripe.com"
required = false
startup_timeout_sec = 15
tool_timeout_sec = 60

[mcp_servers.sentry]
url = "https://mcp.sentry.dev/mcp/repworth-nv/javascript-nextjs"
required = false
startup_timeout_sec = 15
tool_timeout_sec = 60

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
required = false
startup_timeout_sec = 15
tool_timeout_sec = 60

[sandbox_workspace_write]
network_access = true

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_SUBAGENT_MODEL = "sonnet"
