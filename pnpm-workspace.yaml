# Supply-chain hardening (react-doctor/require-pnpm-hardening):
# - minimumReleaseAge delays installs of freshly published versions (7 days)
#   so a compromised release has time to be caught and unpublished.
# - trustPolicy: no-downgrade rejects packages whose provenance/signature
#   trust signals weaken between updates.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  # Hooks are installed by the root `prepare: lefthook install` script (always
  # runs, unlike a dependency postinstall); lefthook's own build is redundant.
  lefthook: false
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
overrides:
  postcss: 8.5.15
